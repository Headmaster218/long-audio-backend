[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "long-audio-backend"
version = "0.2.0rc3.dev6"
description = "Local, bounded-resource incremental audio analysis API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18",
  "pydantic-settings>=2.6,<3", "psutil>=6,<8",
]

[project.optional-dependencies]
inference = ["numpy>=1.26,<3", "soundfile>=0.12,<1", "sherpa-onnx>=1.12,<2", "opencc-python-reimplemented==0.1.7"]
benchmark = ["rapidfuzz>=3.9,<4"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["audio_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.package-data]
audio_backend = ["profiles/*.json"]
